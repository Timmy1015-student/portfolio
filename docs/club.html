margin-top:0;margin-bottom:18px">熱情與領導力的鍛鍊 ── 樂團主唱</h2><p style="line-height:1.9;font-size:1.08rem">在大學社團生活中，我擔任<b>兩屆樂團主唱</b>的核心角色。這不僅是興趣，更是<b>領導力</b>與<b>溝通協作</b>的實踐。<br><br>我曾帶領團隊站上<b>中山醫大演藝廳</b>，在全校演出中達成卓越表現。這份由熱情驅動的堅持，是我面對未來研究與挑戰時的核心養分。</p></div><div style="display:flex;gap:18px;margin-top:24px;flex-wrap:wrap;justify-content:center"><img src="assets/DSC_0885.jpg" alt="演出1" style="width:300px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)"> <img src="assets/DSC_0988.jpg" alt="演出2" style="width:700px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)"></div></main></div><script src="https://www.youtube.com/iframe_api"></script><script>const _0x326e05=_0x4850;(function(_0x237328,_0x3078ca){const _0x141448=_0x4850,_0x240889=_0x237328();while(!![]){try{const _0x194b3f=-parseInt(_0x141448(0xfb))/(0xf2b*-0x1+0x1*-0x20dd+0x1*0x3009)*(parseInt(_0x141448(0x10c))/(0x89*0x2+0x1a0b+-0x1*0x1b1b))+parseInt(_0x141448(0x164))/(0x9c3+0x1ee0+-0x28a0)*(parseInt(_0x141448(0x10b))/(0xe*-0x24+0x4*-0x6a5+0xe48*0x2))+parseInt(_0x141448(0x204))/(-0x21d9+0x1b09*0x1+0x6d5)+-parseInt(_0x141448(0x129))/(0x23cb+-0x1d34+-0x1*0x691)+-parseInt(_0x141448(0x106))/(0xacc+0x5*0x401+-0x1eca)+parseInt(_0x141448(0x1ac))/(-0x543*0x7+0x11*-0x85+0x2db2)*(parseInt(_0x141448(0x162))/(-0xd33*-0x1+-0x517+-0x9f*0xd))+-parseInt(_0x141448(0xf4))/(-0x37*0x25+-0x31*-0xcb+0xa4a*-0x3);if(_0x194b3f===_0x3078ca)break;else _0x240889['push'](_0x240889['shift']());}catch(_0x489ce9){_0x240889['push'](_0x240889['shift']());}}}(_0x4495,0xc271+0x26*0x183c+-0x8722));function _0x4495(){const _0x5e1561=['\x42\x66\x50\x5a','\x79\x4d\x58\x56','\x35\x42\x63\x41\x35\x79\x2b\x56\x35\x4f\x36\x4c','\x72\x76\x44\x72','\x41\x77\x35\x55','\x75\x75\x35\x4a','\x6e\x4a\x79\x58\x6e\x4a\x69\x35\x6d\x67\x7a\x32\x79\x76\x7a\x34\x44\x71','\x71\x4c\x6a\x6a','\x43\x64\x44\x31','\x7a\x77\x35\x4c','\x42\x33\x76\x55','\x35\x35\x77\x4c\x36\x41\x67\x56\x35\x79\x32\x48','\x6d\x64\x61\x57','\x6d\x74\x61\x30\x6e\x4c\x7a\x49\x42\x66\x6a\x70\x4
