<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>專案內容</title><link rel="icon" href="favicon.ico" type="image/x-icon"><style>:root{--bg1:rgb(200, 221, 253);--bg2:rgb(165, 249, 187);--bg3:rgb(251, 172, 234);--transition:all 0.6s cubic-bezier(0.4, 0, 0.2, 1)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Segoe UI','微軟正黑體',Arial,sans-serif;margin:0;padding:0;background:url(assets/64ffaa8061d3643b563785e95f040705.gif) no-repeat center center fixed;background-size:cover;transition:var(--transition);overflow-x:hidden}#mode-overlay{position:fixed;top:-110%;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:10vh;z-index:999999;transition:top .8s cubic-bezier(.77,0,.175,1);background:linear-gradient(180deg,#74ebd5 0,#acb6e5 100%)}#mode-overlay.active{top:0}#mode-overlay.exit{top:110%}#overlay-icon{font-size:5rem;animation:rotateIcon 2s infinite linear;display:block}@keyframes rotateIcon{from{transform:rotate(0)}to{transform:rotate(360deg)}}body.dark-mode{background-color:#18191a!important;background-image:none!important;color:#e4e6eb}body.dark-mode .sidebar{background:#242526!important;border-right:2px solid #555}body.dark-mode .main-content{background:#242526!important;color:#e4e6eb!important;border:2px solid #555!important;box-shadow:0 4px 12px rgba(0,0,0,.5)}body.dark-mode #file-frame h3,body.dark-mode #main-desc h2,body.dark-mode .sidebar h3,body.dark-mode .top-bar span{color:#fff!important;text-shadow:0 0 4px #fff,0 0 8px rgba(69,189,255,.8)!important}body.dark-mode .sidebar a{background:#3a3b3c!important;color:#e4e6eb!important;border:1px solid #666}body.dark-mode .sidebar a.active,body.dark-mode .sidebar a:hover{border-color:#45bdff;color:#45bdff!important}.container{display:flex;min-height:100vh}.sidebar{position:fixed;top:0;left:0;height:100vh;z-index:10;background:rgba(234,241,251,.85);width:220px;padding:24px 0 16px 0;display:flex;flex-direction:column;align-items:center;border-top-right-radius:18px;border-bottom-right-radius:18px;overflow-y:auto;transition:var(--transition)}.sidebar h3{width:180px;margin:0 0 10px 0;font-size:1.05rem;color:#2d5be3;font-weight:700;transition:var(--transition)}.sidebar .group{width:90%;display:flex;flex-direction:column;align-items:center;padding:12px;border-radius:12px;margin-bottom:16px}.sidebar .group.projects{background:var(--bg2)}.sidebar .group.research{background:var(--bg3)}.sidebar a{display:block;width:180px;padding:10px 16px;margin-bottom:10px;color:#222;background:#eaf1fb;border-radius:8px;text-decoration:none;font-size:1rem;transition:background .2s;text-align:left;border:1px solid transparent}.sidebar a.active,.sidebar a:hover{background:#d0e3fa;font-weight:700}.main-content{margin-left:250px;margin-top:40px;margin-right:80px;flex:1;padding:48px 40px;background:rgba(255,255,255,.92);border-radius:18px;min-height:400px;box-shadow:0 2px 16px rgba(0,0,0,.07);border:2px solid transparent;transition:var(--transition)}.top-bar{display:flex;align-items:center;margin-bottom:32px}.top-bar span{transition:var(--transition)}.home-btn{background:#2d5be3;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:1rem;cursor:pointer;margin-right:18px;transition:background .2s;box-shadow:0 4px 15px rgba(45,91,227,.2)}.home-btn:hover{background:#1e00ff}#main-desc h2{transition:var(--transition)}.floating-tools{position:fixed;right:25px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:15px;z-index:1000}.tool-btn{position:relative;width:48px;height:48px;background:#fff;color:#050505;border:1px solid #dddfe2;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.1);transition:var(--transition)}body.dark-mode .tool-btn{background:#3a3b3c;border-color:#777;color:#e4e6eb}.tool-btn::after{content:attr(data-tip);position:absolute;right:60px;background:rgba(0,0,0,.8);color:#fff;padding:6px 12px;border-radius:6px;font-size:.8rem;white-space:nowrap;opacity:0;visibility:hidden;transition:.3s ease}.tool-btn:hover::after{opacity:1;visibility:visible}@media (max-width:900px){.container{flex-direction:column}.sidebar{position:static;width:100vw;height:auto;flex-direction:row;justify-content:flex-start;border-radius:0;padding:12px 10px;overflow-x:auto}.sidebar .group{width:auto;align-items:flex-start;margin:0 10px 0 0}.sidebar a{width:220px;white-space:nowrap}.main-content{margin:12px;padding:24px 10px}.floating-tools{bottom:20px;top:auto;right:10px;flex-direction:row;transform:none}}</style></head><body id="body"><div id="mode-overlay"><span id="overlay-icon">🌙</span></div><div id="fps-card" style="position:fixed;top:15px;right:15px;z-index:1000001;padding:6px 12px;border-radius:10px;display:flex;align-items:center;gap:8px;font-family:'Segoe UI','微軟正黑體',sans-serif;font-weight:700;font-size:1rem;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.1);backdrop-filter:blur(5px);border:1.5px solid transparent;transition:background-color .4s ease,border-color .4s ease"><span id="fps-value" style="color:#555">FPS: --</span><span id="fps-status" style="color:#27ae60;font-size:.95rem">載入中</span></div><div class="floating-tools"><button class="tool-btn" data-tip="深淺色切換" onclick="runTransition()">🌓</button><button class="tool-btn" data-tip="分享連結" onclick="shareLink()">🔗</button><button class="tool-btn" data-tip="回到頂部" onclick='window.scrollTo({top:0,behavior:"smooth"})'>🔼</button><button class="tool-btn" data-tip="移到底部" onclick='window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})'>🔽</button></div><div class="container"><nav class="sidebar"><div class="group projects"><h3>專案選單</h3><a href="project.html">日辰資訊公司實習</a><a href="ai.html">人工智慧概論</a><a href="dev.html">軟體開發</a><a href="nodered.html" class="active">NODERED網頁建置</a><a href="menu.html">專題(飲食菜單推薦系統)</a></div><div class="group research"><h3>競賽 / 研究</h3><a href="award.html">競賽成果或獲獎</a><a href="club.html">大學熱音社</a><a href="startup.html">創新創業計劃書及簡報</a><a href="research.html">研究計畫</a></div></nav><div class="main-content"><div class="top-bar" style="display:flex;align-items:center"><button class="home-btn" onclick='location.href="index.html"'>首頁</button><span style="font-size:1.2rem;font-weight:700">NODERED網頁建置(色盲輔助系統)</span></div><div id="main-desc"><div style="display:flex;align-items:flex-start"><div style="flex:1"><h2 style="color:#d518ff;font-weight:700;margin-bottom:18px;display:flex;align-items:center">專業應用的實踐 ── 醫用資訊系統課程<button onclick="showFile()" style="margin-left:18px;padding:8px 18px;border-radius:8px;border:none;background:#7e01a4;color:#fff;font-size:1rem;cursor:pointer">PDF檔案瀏覽</button></h2><p style="line-height:1.9;font-size:1.08rem">我將<strong style="color:#27ae60">「以人為本」</strong>的理念，實踐於許文馨老師「醫用資訊系統」課程的期末專案——<strong style="color:#27ae60">色盲輔助系統</strong>的開發中。<br><br>在系統開發上，我負責<strong style="color:#27ae60">核心功能</strong>，包含運用<strong style="color:#27ae60">顏色距離演算法</strong>辨識圖片色彩，並結合<strong style="color:#27ae60">Node-RED</strong>控制<strong style="color:#27ae60">石原氏色盲測試流程</strong>、將結果寫入資料庫。<br><br>這個專案最終課程也取得<strong style="color:#27ae60">前五名的佳績</strong>。</p></div></div></div><div id="file-view" style="margin-top:24px;display:none"><button onclick="hideFile()" style="margin-bottom:16px;padding:6px 16px;border-radius:8px;border:none;background:#888;color:#fff;font-size:1rem;cursor:pointer">返回</button><div id="file-frame"></div></div></div></div><script>// 禁止右鍵
document.oncontextmenu = () => false;
// 禁止鍵盤特定按鍵 (如 F12)
document.onkeydown = (e) => {
    if (e.keyCode === 123) return false;
};
        const overlay = document.getElementById('mode-overlay');
        const overlayIcon = document.getElementById('overlay-icon');
        const body = document.getElementById('body');
        const fpsCard = document.getElementById('fps-card');
        const fpsValue = document.getElementById('fps-value');
        const fpsStatus = document.getElementById('fps-status');

        function runTransition() {
            const isDark = body.classList.contains('dark-mode');
            overlayIcon.innerText = isDark ? '☀️' : '🌙';
            
            if (isDark) {
                overlay.style.background = 'linear-gradient(180deg, #74ebd5 0%, #acb6e5 100%)';
            } else {
                overlay.style.background = 'linear-gradient(180deg, #2c3e50 0%, #000000 100%)';
            }
            
            overlay.classList.remove('exit');
            overlay.classList.add('active');

            setTimeout(() => {
                body.classList.toggle('dark-mode');
                localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
            }, 850); 

            setTimeout(() => {
                overlay.classList.add('exit');
                overlay.classList.remove('active');
            }, 1700);
        }

        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
        }

        function shareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('網址已複製到剪貼簿！');
        }

        function showFile() {
            document.getElementById('main-desc').style.display = 'none';
            document.getElementById('file-view').style.display = 'block';
            document.getElementById('file-frame').innerHTML = `
                <h3 style="margin-top:0;">PDF檔案瀏覽</h3>
                <iframe src="assets/色盲輔助系統-- 1158028陳霆嘉 (1).pdf" width="100%" height="800px" style="border:none;border-radius:12px;"></iframe>
            `;
        }
        function hideFile() {
            document.getElementById('main-desc').style.display = 'block';
            document.getElementById('file-view').style.display = 'none';
            document.getElementById('file-frame').innerHTML = '';
        }

        // FPS 邏輯
        (function() {
            let frameCount = 0;
            let lastTime = performance.now();

            function updateFPS() {
                frameCount++;
                const currentTime = performance.now();
                if (currentTime - lastTime >= 1000) {
                    const fps = frameCount;
                    frameCount = 0;
                    lastTime = currentTime;
                    fpsValue.innerText = `FPS: ${fps}`;
                    if (fps >= 55) { fpsStatus.innerText = "十分流暢"; fpsStatus.style.color = "#27ae60"; }
                    else if (fps >= 30) { fpsStatus.innerText = "尚可接受"; fpsStatus.style.color = "#f39c12"; }
                    else { fpsStatus.innerText = "略顯卡頓"; fpsStatus.style.color = "#e74c3c"; }

                    const isDark = body.classList.contains('dark-mode');
                    if (isDark) {
                        fpsCard.style.backgroundColor = "rgba(45, 45, 45, 0.85)";
                        fpsCard.style.borderColor = "#555";
                        fpsValue.style.color = "#eee";
                    } else {
                        fpsCard.style.backgroundColor = "rgba(234, 241, 251, 0.9)";
                        fpsCard.style.borderColor = "transparent";
                        fpsValue.style.color = "#555";
                    }
                }
                requestAnimationFrame(updateFPS);
            }
            updateFPS();
        })();</script></body></html>
