薦系統)</a></div><div class="group research"><h3>競賽 / 研究</h3><a href="award.html">競賽成果或獲獎</a> <a href="club.html">大學熱音社</a> <a href="startup.html">創新創業計劃書及簡報</a> <a href="research.html">研究計畫</a></div></nav><main class="main-content"><div class="top-bar" style="display:flex;align-items:center"><button class="home-btn" onclick='location.href="index.html"'>首頁</button> <span style="font-size:1.2rem;font-weight:700">NODERED網頁建置(色盲輔助系統)</span></div><article id="main-desc"><h2 style="color:#d518ff;font-weight:700;margin-bottom:18px;display:flex;align-items:center">專業應用的實踐 ── 醫用資訊系統課程 <button onclick="showFile()" style="margin-left:18px;padding:8px 18px;border-radius:8px;border:none;background:#7e01a4;color:#fff;font-size:1rem;cursor:pointer">PDF檔案瀏覽</button></h2><p style="line-height:1.9;font-size:1.08rem">我將<strong style="color:#27ae60">「以人為本」</strong>的理念，實踐於許文馨老師「醫用資訊系統」課程的期末專案—— <strong style="color:#27ae60">色盲輔助系統</strong>的開發中。<br><br>在系統開發上，我負責<strong style="color:#27ae60">核心功能</strong>，包含運用<strong style="color:#27ae60">顏色距離演算法</strong>辨識圖片色彩，並結合 <strong style="color:#27ae60">Node-RED</strong>控制<strong style="color:#27ae60">石原氏色盲測試流程</strong>、將結果寫入資料庫。<br><br>這個專案最終課程也取得<strong style="color:#27ae60">前五名的佳績</strong>。</p></article><div id="file-view" style="margin-top:24px;display:none"><button onclick="hideFile()" style="margin-bottom:16px;padding:6px 16px;border-radius:8px;border:none;background:#888;color:#fff;font-size:1rem;cursor:pointer">返回</button><div id="file-frame"></div></div></main></div><script>const _0x126857=_0x4b6a;(function(_0x44330d,_0x1d77fc){const _0x277026=_0x4b6a,_0x203024=_0x44330d();while(!![]){try{const _0x5717cb=-parseInt(_0x277026(0x15f))/(-0x15c0+-0xa5b*0x3+-0x1a69*-0x2)+-parseInt(_0x277026(0xdd))/(0x7cb*0x1+-0x1911+0x9e*0x1c)+-parseInt(_0x277026(0x167))/(-0x329+0x1a68+-0x1*0x173c)+parseInt(_0x277026(0x142))/(-0x18a2+-0x12aa+0x2b50)+parseInt(_0x277026(0x9d))/(0x1*0x24ac+0x6*0x4b7+-0x40f1)*(parseInt(_0x277026(0xd4))/(-0x1*-0x266c+-0x1ad2+0x34*-0x
