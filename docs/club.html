ckground:#3a3b3c;border-color:#777;color:#e4e6eb}.tool-btn::after{content:attr(data-tip);position:absolute;right:60px;background:rgba(0,0,0,.8);color:#fff;padding:6px 12px;border-radius:6px;font-size:.8rem;white-space:nowrap;opacity:0;visibility:hidden;transition:.3s ease}.tool-btn:hover::after{opacity:1;visibility:visible}@media (max-width:900px){.container{flex-direction:column}.sidebar{position:static;width:100vw;height:auto;flex-direction:row;justify-content:flex-start;border-radius:0;padding:12px 10px;overflow-x:auto}.sidebar .group{width:auto;align-items:flex-start;margin:0 10px 0 0}.sidebar a{width:220px;white-space:nowrap}.main-content{margin:12px;padding:24px 10px}.floating-tools{bottom:20px;top:auto;right:10px;flex-direction:row;transform:none}}</style></head><body id="body"><div id="fps-card" style="position:fixed;top:15px;right:15px;z-index:1000001;padding:6px 12px;border-radius:10px;display:flex;align-items:center;gap:8px;font-family:'Segoe UI','微軟正黑體',sans-serif;font-weight:700;font-size:1rem;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.1);backdrop-filter:blur(5px);border:1.5px solid transparent;transition:background-color .4s ease,border-color .4s ease"><span id="fps-value" style="color:#555">FPS: --</span> <span id="fps-status" style="color:#27ae60;font-size:.95rem">載入中</span></div><div id="mode-overlay"><span id="overlay-icon">🌙</span></div><div class="floating-tools"><button class="tool-btn" data-tip="深淺色切換" onclick="runTransition()">🌓</button> <button class="tool-btn" data-tip="分享連結" onclick="shareLink()">🔗</button> <button class="tool-btn" data-tip="回到頂部" onclick='window.scrollTo({top:0,behavior:"smooth"})'>🔼</button> <button class="tool-btn" data-tip="移到底部" onclick='window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})'>🔽</button></div><div class="container"><nav class="sidebar" aria-label="側邊導覽"><div class="group projects"><h3>專案選單</h3><a href="project.html">日辰資訊公司實習</a> <a href="ai.html">人工智慧概論</a> <a href="dev.html">軟體開發</a> <a href="nodered.html">NODERED網頁建置</a> <a href="menu.html">專題(飲食菜單推薦系統)</a></div><div class="group research"><h3>競賽 / 研究</h3><a href="award.html">競賽成果或獲獎</a> <a href="club.html" class="active">大學熱音社</a> <a href="startup.html">創新創業計劃書及簡報</a> <a href="research.html">研究計畫</a></div></nav><main class="main-content"><div class="top-bar"><button class="home-btn" onclick='location.href="index.html"'>首頁</button> <span style="font-size:1.2rem;font-weight:700">大學熱音社</span> <a href="https://youtu.be/AfQI05pMPss" target="_blank" style="margin-left:12px"><img src="assets/Logo_of_YouTube_(2015-2017).svg.png" alt="YouTube Icon" style="width:60px;height:30px;vertical-align:middle"></a></div><div><p style="line-height:1.9;font-size:1.08rem">在大學的社團生活中，我選擇將時間與精力投注於<strong style="color:#27ae60">熱門音樂社</strong>，並<strong style="color:#27ae60">兩屆擔任樂團主唱</strong>的核心角色。這不僅是興趣的展現，更是<strong style="color:#27ae60">責任感</strong>與<strong style="color:#27ae60">領導力</strong>的磨練。<br><br>這份對<strong style="color:#27ae60">品質的堅持</strong>，讓我們贏得了在<strong style="color:#27ae60">中山醫大演藝廳</strong>為全校師生演出的寶貴機會。能<strong style="color:#27ae60">帶領團隊站上正式舞台</strong>，將我們的努力成果呈現給觀眾。<br><br>這份由<strong style="color:#27ae60">熱情</strong>所驅動的<strong style="color:#27ae60">專注</strong>與<strong style="color:#27ae60">毅力</strong>，將是我面對未來研究挑戰時的重要資產。</p><div style="display:flex;gap:18px;margin-top:24px;flex-wrap:wrap"><img src="assets/DSC_0885.jpg" alt="社團照片1" style="width:250px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:var(--transition)"> <img src="assets/DSC_0988.jpg" alt="社團照片2" style="width:550px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:var(--transition)"></div></div></main></div><script>function b(c,d){c=c-(0x2f0*0xa+0x23d2+0x2f*-0x15f);const e=a();let f=e[c];return f;}const q=b;(function(c,d){const m=b,e=c();while(!![]){try{const f=parseInt(m(0xf6))/(0x2118+0x21fc+0x995*-0x7)*(parseInt(m(0xfe))/(0x136*-0x5+0x1*-0x16d9+0x3*0x9a3))+-parseInt(m(0xc8))/(0x11e6+0x1bd1+-0x2db4)+-p
