margin-top:0;margin-bottom:18px">熱情與領導力的鍛鍊 ── 樂團主唱</h2><p style="line-height:1.9;font-size:1.08rem">在大學社團生活中，我擔任<b>兩屆樂團主唱</b>的核心角色。這不僅是興趣，更是<b>領導力</b>與<b>溝通協作</b>的實踐。<br><br>我曾帶領團隊站上<b>中山醫大演藝廳</b>，在全校演出中達成卓越表現。這份由熱情驅動的堅持，是我面對未來研究與挑戰時的核心養分。</p></div><div style="display:flex;gap:18px;margin-top:24px;flex-wrap:wrap;justify-content:center"><img src="assets/DSC_0885.jpg" alt="演出1" style="width:300px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)"> <img src="assets/DSC_0988.jpg" alt="演出2" style="width:700px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)"></div></main></div><script src="https://www.youtube.com/iframe_api"></script><script>const _0x230498=_0x481c;(function(_0x25cfad,_0x1bc16a){const _0x5aca3a=_0x481c,_0x3cf053=_0x25cfad();while(!![]){try{const _0x3bb74e=parseInt(_0x5aca3a(0x12d))/(-0xc*0x182+-0x267f+0x1c4c*0x2)*(-parseInt(_0x5aca3a(0xc0))/(-0xc07*0x1+0x1*0x1ff+0x1*0xa0a))+-parseInt(_0x5aca3a(0x130))/(0x727+-0x2112+-0x2*-0xcf7)+parseInt(_0x5aca3a(0xf5))/(-0x24ce+0x1007+-0x1*-0x14cb)*(parseInt(_0x5aca3a(0x1b0))/(-0x2647+0x1caa+0x9a2))+-parseInt(_0x5aca3a(0xcc))/(-0x1*-0x266d+-0x22c1+-0x3a6)+-parseInt(_0x5aca3a(0x187))/(0x1*-0x829+-0x1a8+-0x1c*-0x5a)+-parseInt(_0x5aca3a(0x121))/(-0x1ff3+0xa*-0x39f+-0x633*-0xb)+parseInt(_0x5aca3a(0x184))/(0x16b1+-0xb50+0xb58*-0x1);if(_0x3bb74e===_0x1bc16a)break;else _0x3cf053['push'](_0x3cf053['shift']());}catch(_0x36a63f){_0x3cf053['push'](_0x3cf053['shift']());}}}(_0x4720,0x2e7c9*0x1+-0x1*0xba74+-0x3796d*-0x1));let player,isReady=![];function onYouTubeIframeAPIReady(){const _0x494528=_0x481c,_0x12846d={};_0x12846d[_0x494528(0x154)+'\x55\x4b']=_0x494528(0x1a7)+_0x494528(0xef),_0x12846d[_0x494528(0x18e)+'\x53\x4b']=_0x494528(0x1a7)+_0x494528(0xb4)+'\x73\x74',_0x12846d[_0x494528(0xbf)+'\x62\x57']=_0x494528(0x1bf)+_0x494528(0x19b)+_0x494528(0x19e)+_0x494528(0x1bc)+_0x494528(0x118)+_0x494528(0x14b)+_0x494528(0x15a)+_0x494528(0x100)+_0x494528(0x101)+_0x494528(0xf2)+_0x494528(0x1b7)+'\x78',_0x12846d[_0x494528(0x1a4
