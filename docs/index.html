<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的個人資料</title><link rel="icon" href="favicon.ico" type="image/x-icon"><style>:root{--bg1:rgb(200, 221, 253);--bg2:rgb(165, 249, 187);--bg3:rgb(251, 172, 234);--card-radius:18px;--shadow:0 2px 16px rgba(0,0,0,0.07);--transition:all 0.5s cubic-bezier(0.4, 0, 0.2, 1)}*{box-sizing:border-box}html{font-size:16px;scroll-behavior:smooth}body{margin:0;font-family:'Segoe UI','微軟正黑體',Arial,sans-serif;background:url(assets/64ffaa8061d3643b563785e95f040705.gif) no-repeat center center fixed;background-size:cover;color:#1c1e21;transition:var(--transition);overflow-x:hidden}#mode-overlay{position:fixed;top:-100%;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:10vh;z-index:999999;transition:top .8s cubic-bezier(.77,0,.175,1);background:linear-gradient(180deg,#74ebd5 0,#acb6e5 100%)}#mode-overlay.active{top:0}#mode-overlay.exit{top:100%}#overlay-icon{font-size:5rem;animation:rotateIcon 2s infinite linear;display:block;filter:drop-shadow(0 0 10px rgba(255,255,255,.5))}@keyframes rotateIcon{from{transform:rotate(0)}to{transform:rotate(360deg)}}body.dark-mode{background-color:#18191a!important;background-image:none!important;color:#e4e6eb}body.dark-mode .card{background:#242526!important;color:#e4e6eb!important;border:2px solid #555!important;box-shadow:0 4px 12px rgba(0,0,0,.5)}body.dark-mode h1,body.dark-mode h2{color:#fff!important;text-shadow:0 0 4px #fff,0 0 8px rgba(69,189,255,.8)!important}body.dark-mode .edu-item{color:#fff!important}body.dark-mode .label-degree{color:#45bdff!important}body.dark-mode .card a.listlink{background:#3a3b3c!important;color:#45bdff!important;border:1.5px solid #666!important}body.dark-mode .card a.listlink:hover{border-color:#45bdff!important}main{max-width:1400px;margin:40px auto;padding:0 24px;display:flex;justify-content:center;gap:40px;flex-wrap:nowrap}.card{border-radius:var(--card-radius);box-shadow:var(--shadow);padding:28px 24px 40px;display:flex;flex-direction:column;align-items:flex-start;backdrop-filter:saturate(120%) blur(.5px);transition:var(--transition);border:2px solid transparent}.card.profile{width:680px;max-width:680px;background:var(--bg1)}.card.projects{width:420px;max-width:420px;background:var(--bg2)}.card.experiences{width:420px;max-width:420px;background:var(--bg3)}h1,h2{transition:var(--transition)}.stats-row{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.stats-tag{padding:6px 14px;background:rgba(0,0,0,.08);border-radius:20px;font-size:.9rem;font-weight:600;color:#050505;transition:var(--transition);border:1px solid transparent}body.dark-mode .stats-tag{background:#3a3b3c;color:#e4e6eb;border-color:#666!important}#profile-photo{width:400px;height:auto;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:16px;flex-shrink:0}.profile-info{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px}.profile-info h1{margin:0;font-size:2.5rem;font-weight:800}.mail-row,.yt-row{display:flex;align-items:center;gap:8px}.profile-info a{font-size:1.15rem;color:#2d5be3;text-decoration:underline}body.dark-mode .profile-info a{color:#45bdff}.edu-section{margin-top:10px;line-height:1.8}.edu-item{font-size:1.3rem;margin:0;letter-spacing:.5px;font-weight:700}.label-degree{font-weight:900;color:#036;margin-left:10px}.card h2{margin:0 0 16px 0;font-size:1.4rem;font-weight:700}.card ul{list-style:none;padding:0;margin:0;width:100%}.card li{margin-bottom:16px}.card a.listlink{text-decoration:none;color:#050505;background:rgba(255,255,255,.7);padding:12px 14px;border-radius:10px;transition:var(--transition);display:block;border:1.5px solid transparent}.card a.listlink:hover{transform:translateY(-3px);box-shadow:0 4px 12px rgba(0,0,0,.1)}.floating-tools{position:fixed;right:25px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:15px;z-index:1000}.tool-btn{position:relative;width:48px;height:48px;background:#fff;color:#050505;border:1px solid #dddfe2;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.1);transition:var(--transition)}body.dark-mode .tool-btn{background:#3a3b3c;border-color:#777!important;color:#e4e6eb}.tool-btn::after{content:attr(data-tip);position:absolute;right:60px;background:rgba(0,0,0,.8);color:#fff;padding:6px 12px;border-radius:6px;font-size:.8rem;white-space:nowrap;opacity:0;visibility:hidden;transition:.3s ease}.tool-btn:hover::after{opacity:1;visibility:visible}footer{text-align:center;padding:18px 0;background:rgba(255,255,255,.85);color:#65676b;margin-top:40px;transition:var(--transition)}body.dark-mode footer{background:#242526;color:#b0b3b8;border-top:2px solid #555!important}@media (max-width:900px){main{flex-direction:column;align-items:center}.card.experiences,.card.profile,.card.projects{width:95vw}#profile-photo{width:50vw}}</style></head><div id="fps-card" style="position:fixed;top:15px;right:15px;z-index:1000001;padding:6px 12px;border-radius:10px;display:flex;align-items:center;gap:8px;font-family:'Segoe UI','微軟正黑體',sans-serif;font-weight:700;font-size:1rem;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.1);backdrop-filter:blur(5px);border:1.5px solid transparent;transition:background-color .4s ease,border-color .4s ease"><span id="fps-value" style="color:#555">FPS: --</span> <span id="fps-status" style="color:#27ae60;font-size:.95rem">載入中</span></div><script>(function() {
      // 禁止右鍵
document.oncontextmenu = () => false;
// 禁止鍵盤特定按鍵 (如 F12)
document.onkeydown = (e) => {
    if (e.keyCode === 123) return false;
};
        const fpsCard = document.getElementById('fps-card');
        const fpsValue = document.getElementById('fps-value');
        const fpsStatus = document.getElementById('fps-status');
        
        let frameCount = 0;
        let lastTime = performance.now();

        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            
            if (currentTime - lastTime >= 1000) {
                const fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;

                // 更新數字
                fpsValue.innerText = `FPS: ${fps}`;

                // 根據 FPS 數值更新評語與顏色 (都要四個字)
                if (fps >= 55) {
                    fpsStatus.innerText = "十分流暢";
                    fpsStatus.style.color = "#27ae60"; // 綠色
                } else if (fps >= 30) {
                    fpsStatus.innerText = "尚可接受";
                    fpsStatus.style.color = "#f39c12"; // 橘色
                } else {
                    fpsStatus.innerText = "略顯卡頓";
                    fpsStatus.style.color = "#e74c3c"; // 紅色
                }

                // 根據深淺色模式調整字卡底色與文字顏色
                const isDark = document.body.classList.contains('dark-mode');
                if (isDark) {
                    fpsCard.style.backgroundColor = "rgba(45, 45, 45, 0.85)";
                    fpsCard.style.borderColor = "#555";
                    fpsValue.style.color = "#eee";
                } else {
                    fpsCard.style.backgroundColor = "rgba(234, 241, 251, 0.9)";
                    fpsCard.style.borderColor = "transparent";
                    fpsValue.style.color = "#555";
                }
            }
            requestAnimationFrame(updateFPS);
        }
        updateFPS();
    })();</script><body id="body"><div id="mode-overlay"><span id="overlay-icon">🌙</span></div><div class="floating-tools"><button class="tool-btn" data-tip="深淺色切換" onclick="runTransition()">🌓</button> <button class="tool-btn" data-tip="分享連結" onclick="shareLink()">🔗</button> <button class="tool-btn" data-tip="回到頂部" onclick='window.scrollTo({top:0,behavior:"smooth"})'>🔼</button> <button class="tool-btn" data-tip="移到底部" onclick='window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})'>🔽</button></div><main><section class="card profile"><img src="assets/20250912_083947.jpg" alt="陳霆嘉大頭貼" id="profile-photo"><div class="profile-info"><h1>陳霆嘉</h1><div class="stats-row"><span class="stats-tag">🎯 目標導向</span> <span class="stats-tag">⚡ RPA / AI</span> <span class="stats-tag">🎸 熱音主唱</span> <span class="stats-tag">🐍 Python</span></div><div class="mail-row"><img src="assets/gmail_new_logo_icon_159149.png" alt="Gmail Icon" style="width:40px;height:40px"> <a href="mailto:cmf3728953@gmail.com">cmf3728953@gmail.com</a></div><div class="yt-row"><img src="assets/Logo_of_YouTube_(2015-2017).svg.png" alt="YouTube Icon" style="width:50px;height:25px"> <a href="https://youtube.com/channel/UC5R8tdnXcVIU73lqzlBbItA" target="_blank" style="margin-left:12px">點擊這裡</a></div><div class="edu-section"><p class="edu-item">國立中山大學 醫學科技研究所<span class="label-degree">碩士</span></p><p class="edu-item">中山醫學大學 醫學資訊學系<span class="label-degree">學士</span></p></div></div></section><section class="card projects"><h2>專案列表</h2><ul><li><a class="listlink" href="project.html">日辰資訊股份有限公司實習</a></li><li><a class="listlink" href="ai.html">人工智慧概論</a></li><li><a class="listlink" href="dev.html">軟體開發</a></li><li><a class="listlink" href="nodered.html">NODERED網頁建置 (色盲輔助系統)</a></li><li><a class="listlink" href="menu.html">專題 (飲食菜單推薦系統)</a></li></ul></section><section class="card experiences"><h2>競賽成果或獲獎 / 研究計畫</h2><ul><li><a class="listlink" href="club.html">大學熱音社</a></li><li><a class="listlink" href="startup.html">創新創業競賽</a></li><li><a class="listlink" href="award.html">競賽成果</a></li><li><a class="listlink" href="research.html">研究計畫</a></li></ul></section></main><footer><p>&copy; 2026 陳霆嘉．版權所有</p></footer><script>const overlay = document.getElementById('mode-overlay');
    const overlayIcon = document.getElementById('overlay-icon');
    const body = document.getElementById('body');

    function runTransition() {
      const isDark = body.classList.contains('dark-mode');
      overlayIcon.innerText = isDark ? '☀️' : '🌙';
      
      if (isDark) {
        overlay.style.background = 'linear-gradient(180deg, #74ebd5 0%, #acb6e5 100%)';
      } else {
        overlay.style.background = 'linear-gradient(180deg, #2c3e50 0%, #000000 100%)';
      }
      
      overlay.classList.remove('exit');
      overlay.classList.add('active');

      setTimeout(() => {
        body.classList.toggle('dark-mode');
        localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
      }, 850); 

      setTimeout(() => {
        overlay.classList.add('exit');
        overlay.classList.remove('active');
      }, 1700);
    }

    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
    }

    function shareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('網址已複製到剪貼簿！');
    }</script></body></html>
