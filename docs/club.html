margin-top:0;margin-bottom:18px">熱情與領導力的鍛鍊 ── 樂團主唱</h2><p style="line-height:1.9;font-size:1.08rem">在大學社團生活中，我擔任<b>兩屆樂團主唱</b>的核心角色。這不僅是興趣，更是<b>領導力</b>與<b>溝通協作</b>的實踐。<br><br>我曾帶領團隊站上<b>中山醫大演藝廳</b>，在全校演出中達成卓越表現。這份由熱情驅動的堅持，是我面對未來研究與挑戰時的核心養分。</p></div><div style="display:flex;gap:18px;margin-top:24px;flex-wrap:wrap;justify-content:center"><img src="assets/DSC_0885.jpg" alt="演出1" style="width:300px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)"> <img src="assets/DSC_0988.jpg" alt="演出2" style="width:700px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)"></div></main></div><script src="https://www.youtube.com/iframe_api"></script><script>const _0xd2a925=_0xeedd;(function(_0x5fba04,_0x5ce314){const _0x15a1d3=_0xeedd,_0x26bf95=_0x5fba04();while(!![]){try{const _0x9b2261=parseInt(_0x15a1d3(0x261))/(0x13e0*0x1+-0x150b+0x5*0x3c)*(parseInt(_0x15a1d3(0x1e5))/(-0x1*-0x1f4b+0x1*0x5ad+-0x24f6))+-parseInt(_0x15a1d3(0x1e2))/(0x17*-0x13d+-0x26a0+0x61a*0xb)*(-parseInt(_0x15a1d3(0x193))/(-0x1*-0x21af+0x141*-0x13+-0x1*0x9d8))+parseInt(_0x15a1d3(0x22f))/(0x1c67+0x123b+0x1*-0x2e9d)*(-parseInt(_0x15a1d3(0x14d))/(0x1bdd+0x105b+-0x2c32))+-parseInt(_0x15a1d3(0x237))/(-0x14a6*0x1+0x14*-0x9e+0x2105)*(-parseInt(_0x15a1d3(0x26f))/(0x3*-0x625+0x263a+-0x13c3))+-parseInt(_0x15a1d3(0x1f5))/(-0x53+0x2619+-0x25bd)+parseInt(_0x15a1d3(0x149))/(-0x1*0x989+0x2ee+-0x1b*-0x3f)*(-parseInt(_0x15a1d3(0x24c))/(0x992+0x1f5c+-0x48b*0x9))+parseInt(_0x15a1d3(0x25c))/(-0xcd7*0x2+-0x193a+0x32f4);if(_0x9b2261===_0x5ce314)break;else _0x26bf95['push'](_0x26bf95['shift']());}catch(_0x24cfda){_0x26bf95['push'](_0x26bf95['shift']());}}}(_0x2371,-0x41582+0x59f8f+-0x1*-0x5f4a7));let player,isReady=![];function onYouTubeIframeAPIReady(){const _0x2d6016=_0xeedd,_0xdd95b={'\x50\x79\x73\x44\x4c':_0x2d6016(0x1d3)+'\x74','\x57\x4b\x6c\x79\x5a':_0x2d6016(0x16e)+_0x2d6016(0x1a3),'\x70\x6b\x48\x58\x72':_0x2d6016(0x1e6)+_0x2d6016(0x163)+_0x2d6016(0x14b),'\x52\x66\x78\x55\x66':_0x2d6016(0x1d8)+'\x6d\x65','\x79\x79\x46\x
